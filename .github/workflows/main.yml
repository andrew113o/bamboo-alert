name: Check Bamboo Booking

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 자동 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 예약 체크 실행
        run: |
          python check_booking.py
